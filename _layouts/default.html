<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <div class="page-wrapper">
    <main class="site-main">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
  <script>
    (function() {
      function buildCodeBlock(codeEl) {
        var pre = codeEl.parentElement;
        if (!pre || pre.tagName !== 'PRE') return;

        var container = pre.parentElement;
        if (!container) return;

        var wrapper = document.createElement('div');
        wrapper.className = 'code-block';
        container.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        var lang = '';
        var classes = codeEl.className.split(/\s+/);
        for (var i = 0; i < classes.length; i++) {
          if (classes[i].indexOf('language-') === 0) {
            lang = classes[i].replace('language-', '');
            break;
          }
        }
        if (!lang) lang = 'code';
        var isShell = (lang === 'bash' || lang === 'sh' || lang === 'shell' || lang === 'zsh');

        var bar = document.createElement('div');
        bar.className = 'code-bar';

        var left = document.createElement('div');
        left.className = 'code-bar-left';

        if (isShell) {
          var dots = document.createElement('span');
          dots.className = 'code-dots';
          dots.innerHTML = '<i></i><i></i><i></i>';
          left.appendChild(dots);
        }

        var label = document.createElement('span');
        label.className = 'code-lang';
        label.textContent = lang === 'code' ? 'CODE' : lang.toUpperCase();
        left.appendChild(label);

        var btn = document.createElement('button');
        btn.className = 'code-copy';
        btn.textContent = 'COPY';
        btn.addEventListener('click', function() {
          var text = codeEl.textContent;
          var done = function() {
            btn.textContent = 'COPIED';
            btn.classList.add('copied');
            setTimeout(function() {
              btn.textContent = 'COPY';
              btn.classList.remove('copied');
            }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function() {
              btn.textContent = 'ERROR';
              setTimeout(function() { btn.textContent = 'COPY'; }, 2000);
            });
          } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); }
            catch(e) { btn.textContent = 'ERROR'; setTimeout(function() { btn.textContent = 'COPY'; }, 2000); }
            document.body.removeChild(ta);
          }
        });

        bar.appendChild(left);
        bar.appendChild(btn);
        wrapper.insertBefore(bar, wrapper.firstChild);

        var rawLines = codeEl.textContent.split('\n');
        if (rawLines.length && rawLines[rawLines.length - 1] === '') rawLines.pop();
        var lineCount = rawLines.length;

        if (lineCount > 4) {
          var grid = document.createElement('div');
          grid.className = 'code-grid';

          var nums = document.createElement('div');
          nums.className = 'code-ln';
          for (var j = 1; j <= lineCount; j++) {
            var n = document.createElement('span');
            n.textContent = j;
            nums.appendChild(n);
          }

          var body = document.createElement('div');
          body.className = 'code-body';
          body.appendChild(pre);

          grid.appendChild(nums);
          grid.appendChild(body);
          wrapper.appendChild(grid);
        } else {
          var body = document.createElement('div');
          body.className = 'code-body code-body-full';
          body.appendChild(pre);
          wrapper.appendChild(body);
        }

        if (isShell) {
          var html = codeEl.innerHTML;
          html = html.replace(/^(<span[^>]*>)?(\$\s)/gm, function(m, span, dollar) {
            return '<span class="sh-prompt">$</span> ' + (span || '');
          });
          html = html.replace(/^(<span[^>]*>)?(#.*)/gm, function(m, span, comment) {
            return '<span class="sh-comment">' + m + '</span>';
          });
          codeEl.innerHTML = html;
        }
      }

      function init() {
        hljs.configure({ cssSelector: 'pre code:not(.language-plaintext)' });
        hljs.highlightAll();

        var all = document.querySelectorAll('pre code');
        for (var i = 0; i < all.length; i++) {
          buildCodeBlock(all[i]);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
