<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <div class="page-wrapper">
    {% include header.html %}
    <main class="site-main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scss.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      hljs.configure({ cssSelector: 'pre code, code.language-plaintext' });
      hljs.highlightAll();

      document.querySelectorAll('pre code').forEach(function(block) {
        var pre = block.parentElement;
        if (pre.parentElement && pre.parentElement.classList.contains('code-block')) return;

        var wrapper = document.createElement('div');
        wrapper.className = 'code-block';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        var langClass = Array.from(block.classList).find(function(c) { return c.startsWith('language-'); });
        var langName = langClass ? langClass.replace('language-', '') : 'CODE';
        var isShell = (langName === 'bash' || langName === 'sh' || langName === 'shell' || langName === 'zsh');

        var topBar = document.createElement('div');
        topBar.className = 'code-top-bar';

        var leftSide = document.createElement('div');
        leftSide.className = 'code-left';

        if (isShell) {
          var dots = document.createElement('span');
          dots.className = 'code-dots';
          dots.innerHTML = '<span></span><span></span><span></span>';
          leftSide.appendChild(dots);
        }

        var langLabel = document.createElement('span');
        langLabel.className = 'code-lang-label';
        langLabel.textContent = langName.toUpperCase();
        leftSide.appendChild(langLabel);

        var copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.textContent = 'COPY';
        copyBtn.addEventListener('click', function() {
          var text = block.textContent;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
              copyBtn.textContent = 'COPIED \u2713';
              setTimeout(function() { copyBtn.textContent = 'COPY'; }, 2000);
            });
          } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            copyBtn.textContent = 'COPIED \u2713';
            setTimeout(function() { copyBtn.textContent = 'COPY'; }, 2000);
          }
        });

        topBar.appendChild(leftSide);
        topBar.appendChild(copyBtn);
        wrapper.insertBefore(topBar, wrapper.firstChild);

        var lines = block.innerHTML.split('\n');
        if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
        if (lines.length > 4) {
          var grid = document.createElement('div');
          grid.className = 'code-grid';

          var lineNums = document.createElement('div');
          lineNums.className = 'code-line-numbers';
          for (var i = 0; i < lines.length; i++) {
            var numSpan = document.createElement('span');
            numSpan.textContent = (i + 1);
            lineNums.appendChild(numSpan);
          }

          var codeArea = document.createElement('div');
          codeArea.className = 'code-content';
          codeArea.appendChild(block);

          grid.appendChild(lineNums);
          grid.appendChild(codeArea);
          wrapper.appendChild(grid);
        } else {
          var codeArea = document.createElement('div');
          codeArea.className = 'code-content code-content-full';
          codeArea.appendChild(block);
          wrapper.appendChild(codeArea);
        }

        if (isShell) {
          var shellLines = lines;
          block.innerHTML = shellLines.map(function(line) {
            if (/^\$\s/.test(line)) {
              return '<span class="shell-prompt">$</span><span class="shell-cmd">' + line.replace(/^\$/, '') + '</span>';
            } else if (/^\s*#/.test(line)) {
              return '<span class="shell-comment">' + line + '</span>';
            } else if (/^\s*$/.test(line)) {
              return '';
            } else {
              return '<span class="shell-output">' + line + '</span>';
            }
          }).join('\n');
        }
      });
    });
  </script>
</body>
</html>
