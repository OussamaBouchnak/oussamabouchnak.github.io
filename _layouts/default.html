<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <div class="page-wrapper">
    <main class="site-main">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
  <script>
    (function() {

      var STORAGE_KEY = 'theme';

      function getTheme() {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(STORAGE_KEY, theme);
      }

      function toggleTheme() {
        var html = document.documentElement;
        html.classList.add('transitioning');
        var next = (html.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
        setTheme(next);
        setTimeout(function() { html.classList.remove('transitioning'); }, 500);
      }

      var btn = document.getElementById('theme-toggle');
      if (btn) btn.addEventListener('click', toggleTheme);

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem(STORAGE_KEY)) setTheme(e.matches ? 'dark' : 'light');
      });

      function buildCodeBlock(codeEl) {
        var pre = codeEl.parentElement;
        if (!pre || pre.tagName !== 'PRE') return;

        var container = pre.parentElement;
        if (!container) return;

        var wrapper = document.createElement('div');
        wrapper.className = 'code-block';
        container.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        var lang = '';
        var classes = codeEl.className.split(/\s+/);
        for (var i = 0; i < classes.length; i++) {
          if (classes[i].indexOf('language-') === 0) {
            lang = classes[i].replace('language-', '');
            break;
          }
        }
        if (!lang) lang = 'code';
        var isShell = (lang === 'bash' || lang === 'sh' || lang === 'shell' || lang === 'zsh');

        var bar = document.createElement('div');
        bar.className = 'code-bar';

        var left = document.createElement('div');
        left.className = 'code-bar-left';

        if (isShell) {
          var dots = document.createElement('span');
          dots.className = 'code-dots';
          dots.innerHTML = '<i></i><i></i><i></i>';
          left.appendChild(dots);
        }

        var label = document.createElement('span');
        label.className = 'code-lang';
        label.textContent = lang === 'code' ? 'CODE' : lang.toUpperCase();
        left.appendChild(label);

        var btn2 = document.createElement('button');
        btn2.className = 'code-copy';
        btn2.textContent = 'COPY';
        btn2.addEventListener('click', function() {
          var text = codeEl.textContent;
          var done = function() {
            btn2.textContent = 'COPIED';
            btn2.classList.add('copied');
            setTimeout(function() {
              btn2.textContent = 'COPY';
              btn2.classList.remove('copied');
            }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function() {
              btn2.textContent = 'ERROR';
              setTimeout(function() { btn2.textContent = 'COPY'; }, 2000);
            });
          } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); }
            catch(e) { btn2.textContent = 'ERROR'; setTimeout(function() { btn2.textContent = 'COPY'; }, 2000); }
            document.body.removeChild(ta);
          }
        });

        bar.appendChild(left);
        bar.appendChild(btn2);
        wrapper.insertBefore(bar, wrapper.firstChild);

        var bodyEl = document.createElement('div');
        bodyEl.className = 'code-body';
        bodyEl.appendChild(pre);
        wrapper.appendChild(bodyEl);

        if (isShell) {
          var html = codeEl.innerHTML;
          html = html.replace(/^(<span[^>]*>)?(\$\s)/gm, function(m, span, dollar) {
            return '<span class="sh-prompt">$</span> ' + (span || '');
          });
          codeEl.innerHTML = html;
        }
      }

      function init() {
        hljs.configure({ cssSelector: 'pre code:not(.language-plaintext)' });
        hljs.highlightAll();

        var all = document.querySelectorAll('pre code');
        for (var i = 0; i < all.length; i++) {
          buildCodeBlock(all[i]);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
